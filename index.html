<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site bloqueado</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Site temporariamente bloqueado. Solicite o desbloqueio pelo WhatsApp.">
  <meta name="theme-color" content="#101010">
  <link rel="icon" href="../assets/favicon.png">
  <style>
    :root {
      --bg: #101010;
      --panel: #181818;
      --text: #f8f5ee;
      --muted: #b9b0a3;
      --line: rgba(255, 255, 255, 0.1);
      --green: #16c76f;
      --green-dark: #0d8f4c;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08), transparent 26rem),
        linear-gradient(180deg, #151515 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      line-height: 1.45;
      -webkit-text-size-adjust: 100%;
    }

    main {
      width: min(100%, 420px);
      padding: clamp(26px, 8vw, 38px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.025)), var(--panel);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      text-align: center;
    }

    .icon {
      display: grid;
      width: 68px;
      height: 68px;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.06);
      color: #e8d3a4;
    }

    .icon svg {
      width: 32px;
      height: 32px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 9vw, 3.2rem);
      font-weight: 850;
      line-height: 0.98;
      letter-spacing: -0.045em;
    }

    p {
      max-width: 300px;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 600;
    }

    a {
      display: inline-flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin-top: 24px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #fff;
      font-size: 0.96rem;
      font-weight: 850;
      text-decoration: none;
      box-shadow: 0 18px 38px rgba(22, 199, 111, 0.24);
      transition: transform 180ms ease, filter 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    a:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    a:active {
      transform: scale(0.985);
    }

    a:focus-visible {
      outline: 3px solid rgba(22, 199, 111, 0.45);
      outline-offset: 4px;
    }

    a svg {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
    }

    @media (max-width: 340px) {
      main {
        padding: 24px 18px;
      }

      h1 {
        font-size: 1.9rem;
      }

      p {
        font-size: 0.92rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M7 11V8a5 5 0 0 1 10 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="2"/>
        <path d="M12 15v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <h1 id="page-title">Site bloqueado</h1>
    <p>Para desbloquear, clique no botão abaixo.</p>

        <path d="M12.48 10.32c-.26-.58-.54-.6-.8-.62h-.68c-.24 0-.62.08-.94.42-.32.34-1.22 1.18-1.22 2.88s1.26 3.36 1.44 3.58c.18.24 2.44 3.86 6.02 5.26 2.98 1.18 3.6.94 4.24.88.66-.06 2.12-.86 2.42-1.68.3-.82.3-1.52.2-1.68-.08-.14-.32-.24-.68-.42-.36-.18-2.12-1.04-2.46-1.16-.32-.12-.56-.18-.8.18-.24.34-.92 1.16-1.12 1.4-.2.24-.42.26-.78.08-.36-.18-1.52-.56-2.9-1.78-1.06-.94-1.78-2.12-2-2.48-.2-.34-.02-.54.16-.72.16-.16.36-.42.54-.62.18-.22.24-.36.36-.6.12-.24.06-.44-.02-.62-.08-.18-.78-1.88-1.1-2.56Z" fill="currentColor"/>
      </svg>
      Solicitar desbloqueio

  </main>
</body>
</html>
